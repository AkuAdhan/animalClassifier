<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Classifier</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6af7;
      --accent2: #f76a8a;
      --text: #f0eeff;
      --muted: #8884a8;
      --cat: #f76a8a;
      --dog: #6af7c4;
      --wild: #f7c46a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-top: 2rem;
    }

    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--accent);
      border: 1px solid rgba(124,106,247,0.4);
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 400;
    }

    /* Upload zone */
    .upload-zone {
      border: 1.5px dashed rgba(124,106,247,0.35);
      border-radius: 20px;
      background: var(--surface);
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .upload-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(124,106,247,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--surface2);
    }

    .upload-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(124,106,247,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
      font-size: 28px;
    }

    .upload-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .upload-hint {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    #fileInput { display: none; }

    /* Results area */
    .results-area {
      margin-top: 2rem;
      display: none;
      animation: fadeUp 0.4s ease;
    }

    .results-area.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 540px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    /* Preview card */
    .preview-card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .preview-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .preview-label {
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .preview-label span {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .pred-chip {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 100px;
    }

    .pred-chip.cat  { background: rgba(247,106,138,0.15); color: var(--cat); }
    .pred-chip.dog  { background: rgba(106,247,196,0.15); color: var(--dog); }
    .pred-chip.wild { background: rgba(247,196,106,0.15); color: var(--wild); }

    /* Score card */
    .score-card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .score-label {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.2rem;
    }

    .top-prediction {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .top-animal {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: capitalize;
    }

    .top-animal.cat  { color: var(--cat); }
    .top-animal.dog  { color: var(--dog); }
    .top-animal.wild { color: var(--wild); }

    .top-conf {
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* Bar rows */
    .bar-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bar-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bar-name {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .bar-pct {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .bar-track {
      height: 6px;
      border-radius: 100px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .bar-fill.cat  { background: var(--cat); }
    .bar-fill.dog  { background: var(--dog); }
    .bar-fill.wild { background: var(--wild); }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 3rem;
      display: none;
    }

    .loading.visible { display: block; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(124,106,247,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p {
      color: var(--muted);
      font-size: 0.9rem;
      font-family: 'Space Mono', monospace;
    }

    /* Error */
    .error-box {
      background: rgba(247,106,106,0.08);
      border: 1px solid rgba(247,106,106,0.25);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      color: #f76a6a;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
    .error-box.visible { display: block; }

    /* Try again btn */
    .try-again {
      margin-top: 1.5rem;
      text-align: center;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(124,106,247,0.4);
      color: var(--accent);
      padding: 10px 24px;
      border-radius: 100px;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-outline:hover {
      background: rgba(124,106,247,0.1);
      border-color: var(--accent);
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">AI · Computer Vision · PyTorch</div>
      <h1>Animal Classifier</h1>
      <p class="subtitle">Upload a photo — the model will identify the animal</p>
    </header>

    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">🐾</div>
      <div class="upload-title">Drop an image here</div>
      <p class="upload-hint">or click to browse · JPG, PNG, WEBP</p>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Analyzing image...</p>
    </div>

    <div class="results-area" id="resultsArea">
      <div class="results-grid">
        <div class="preview-card">
          <img id="previewImg" src="" alt="Uploaded animal" />
          <div class="preview-label">
            <span id="fileNameLabel">image.jpg</span>
            <span class="pred-chip" id="predChip">—</span>
          </div>
        </div>

        <div class="score-card">
          <p class="score-label">Classification result</p>
          <div class="top-prediction">
            <div class="top-animal" id="topAnimal">—</div>
            <div class="top-conf" id="topConf">—</div>
          </div>
          <div id="barsContainer" style="display: flex; flex-direction: column; gap: 14px;"></div>
        </div>
      </div>

      <div class="try-again">
        <button class="btn-outline" id="tryAgainBtn">Try another image</button>
      </div>
    </div>

    <footer>
      UTS Praktikum Kecerdasan Buatan 2026 &nbsp;·&nbsp; Animal Faces Dataset (AFHQ)
    </footer>
  </div>

  <script>
    const zone       = document.getElementById('uploadZone');
    const fileInput  = document.getElementById('fileInput');
    const loading    = document.getElementById('loading');
    const resultsArea= document.getElementById('resultsArea');
    const errorBox   = document.getElementById('errorBox');
    const tryAgainBtn= document.getElementById('tryAgainBtn');

    zone.addEventListener('click', () => fileInput.click());

    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('drag-over');
    });

    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));

    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    tryAgainBtn.addEventListener('click', () => {
      resultsArea.classList.remove('visible');
      errorBox.classList.remove('visible');
      zone.style.display = '';
      fileInput.value = '';
    });

    async function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showError('Please upload an image file (JPG, PNG, WEBP).');
        return;
      }

      zone.style.display = 'none';
      errorBox.classList.remove('visible');
      resultsArea.classList.remove('visible');
      loading.classList.add('visible');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res  = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        renderResults(data, file.name);
      } catch (err) {
        loading.classList.remove('visible');
        zone.style.display = '';
        showError('Prediction failed: ' + err.message);
      }
    }

    function renderResults(data, fileName) {
      loading.classList.remove('visible');

      const cls = data.prediction.toLowerCase();

      document.getElementById('previewImg').src = `data:image/jpeg;base64,${data.image_b64}`;
      document.getElementById('fileNameLabel').textContent = fileName;

      const chip = document.getElementById('predChip');
      chip.textContent = data.prediction;
      chip.className   = `pred-chip ${cls}`;

      const topAnimal = document.getElementById('topAnimal');
      topAnimal.textContent  = data.prediction;
      topAnimal.className    = `top-animal ${cls}`;
      document.getElementById('topConf').textContent = `${data.confidence.toFixed(1)}% confidence`;

      const bars = document.getElementById('barsContainer');
      bars.innerHTML = '';
      data.all_scores.forEach(item => {
        const c = item.label.toLowerCase();
        bars.innerHTML += `
          <div class="bar-row">
            <div class="bar-info">
              <span class="bar-name ${c}">${item.label}</span>
              <span class="bar-pct">${item.confidence.toFixed(1)}%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill ${c}" style="width: ${item.confidence}%"></div>
            </div>
          </div>`;
      });

      resultsArea.classList.add('visible');
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }
  </script>
</body>
</html>
